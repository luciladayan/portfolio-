<!-- 🔵 NAVBAR ETIKETA ADAPTADA -->
<style>
  :root{
    --brand:#00B9E8; --navTop:44px; --navH:80px;
    --hambH:56px; --hamburgerRight:24px; --navGapRight:120px;
  }

  .navOverlay{
    position:fixed; left:0; right:0;
    top:var(--navTop); z-index:60;
    display:flex; justify-content:center;
    pointer-events:none;
  }

  .nav{
    width:min(1280px, calc(100% - var(--navGapRight) - 48px));
    height:var(--navH);
    display:flex; align-items:center; justify-content:space-between;
    background:#fff;
    border-radius:22px;
    padding:0 24px;
    box-shadow:0 2px 0 rgba(0,0,0,.02), 0 18px 40px rgba(0,0,0,.08);
    transform-origin:top right;
    transition:opacity .18s ease, transform .18s ease;
    pointer-events:auto;
    opacity:1; transform:scale(1);
  }
  .nav.is-hidden{ transform:scale(.98); opacity:0; pointer-events:none; }

  .menu{
    display:flex; align-items:center;
    gap:44px; font-weight:800;
  }
  .menu a{
    color:#1f2937; text-decoration:none;
  }

  .actions{
    display:flex; align-items:center; gap:12px;
  }

  .btn{
    height:46px; padding:0 22px; border-radius:999px;
    font-weight:800; border:2px solid var(--brand);
    background:#fff; color:#0aaed9; text-decoration:none;
    display:inline-flex; align-items:center; justify-content:center;
    transition:.2s;
  }
  .btn.primary{
    background:var(--brand); color:#fff;
    border-color:var(--brand);
  }

  .hamburger{
    position:fixed; right:var(--hamburgerRight);
    top:calc(var(--navTop) + (var(--navH) - var(--hambH))/2);
    z-index:65;
    width:var(--hambH); height:var(--hambH);
    border-radius:999px;
    border:2px solid var(--brand);
    background:#fff; color:#0aaed9;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 10px 28px rgba(0,185,232,.25);
  }
</style>

<!-- 🔵 HTML -->
<div class="navOverlay">
  <nav class="nav" id="nav">
    <div class="menu">
      <a class="navlink" href="#ingredientes">Ingredientes</a>
      <a class="navlink" href="#how">Cómo funciona</a>
      <a class="navlink" href="#usecases">Casos</a>
      <a class="navlink" href="#metrics">Datos</a>
    </div>

    <div class="actions">
      <a class="btn" href="#cta">Login</a>
      <a class="btn primary" href="#cta">Registrarse</a>
    </div>
  </nav>
</div>

<button class="hamburger" id="hamburger" aria-expanded="true">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="2">
    <path d="M3 6h18M3 12h18M3 18h18"/>
  </svg>
</button>

<!-- 🔵 JS -->
<script>
  const nav = document.getElementById("nav");
  const hamburger = document.getElementById("hamburger");
  const navlinks = document.querySelectorAll(".navlink");

  let isOpen = true;
  let userInteracted = false;

  function setOpen(v){
    isOpen = v;
    nav.classList.toggle("is-hidden", !v);
    hamburger.setAttribute("aria-expanded", v);
  }

  function init(){
    const desktop = innerWidth >= 981;
    if(!userInteracted) setOpen(desktop);
  }
  init();
  addEventListener("resize", init);

  hamburger.addEventListener("click", ()=>{
    userInteracted = true;
    setOpen(!isOpen);
  });

  navlinks.forEach(a =>
    a.addEventListener("click", ()=> {
      setTimeout(()=>setOpen(false), 80);
    })
  );

  addEventListener("scroll", ()=>{
    if(scrollY <= 10) setOpen(true);
  }, {passive:true});
</script>
